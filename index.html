<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title + meta description : gérés dynamiquement par SEOHead.jsx
         (react-helmet-async) pour CHAQUE route. Ne pas en remettre ici :
         Helmet ne supprime jamais les balises statiques existantes,
         ce qui créerait des balises dupliquées (constaté et corrigé). -->
    <title>Tropicaura</title>

    <!-- ── Favicons & icônes (générés depuis le vrai logo — voir
         scripts/generate-favicons.mjs, régénérés à chaque build) ── -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- 48x48 et 192x192 : Google Search n'affiche un favicon dans ses
         résultats que s'il trouve un carré MULTIPLE DE 48 déclaré en
         rel="icon". Sans ces deux lignes, seuls 16 et 32 étaient exposés et
         Search affichait l'icône de globe générique à la place du logo.
         Le 192 existait déjà (fichier du manifeste PWA) mais n'était pas
         déclaré ici, donc invisible pour le crawler. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0B0F0A" />
    <meta name="msapplication-TileColor" content="#0B0F0A" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- ── PWA / manifest ── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0F0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tropicaura" />

    <!-- ── Core Web Vitals : préconnexion + polices ──
         @import CSS (ancienne approche dans global.css) est bloquant pour
         le rendu : le navigateur doit télécharger le CSS, le parser, PUIS
         découvrir l'@import avant même de commencer à charger la police.
         Un <link rel="stylesheet"> direct ici permet une découverte et un
         téléchargement parallèles dès le tout début du parsing HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700;800;900&family=Dancing+Script:wght@600;700&display=swap"
    />

    <!-- Logo de marque : présent en position fixe sur TOUTES les pages
         (TopBar) → préchargement pour éviter tout flash sans logo. -->
    <link rel="preload" as="image" href="/logo-mark.png" fetchpriority="high" />

    <!-- Google Analytics 4 — chargé statiquement (pas via JS après montage
         React) car les crawlers de vérification (Google Search Console,
         Analytics) ne lisent que le HTML servi, pas le DOM post-hydratation.
         %VITE_GA_MEASUREMENT_ID% est substitué au build par Vite depuis la
         variable d'env Vercel — jamais de valeur en dur dans le code source.
         Le script d'initialisation est un fichier EXTERNE (/ga-init.js), pas
         inline : le CSP (script-src 'self' ...) bloque les scripts inline
         sans nonce/hash, un fichier same-origin passe nativement.
         Consentement RGPD par défaut refusé ; mis à jour via gtag('consent',
         'update', ...) par le bandeau de cookies (voir lib/analytics.js). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script src="/ga-init.js" data-ga-id="%VITE_GA_MEASUREMENT_ID%"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Tropicaura — Export premium de fruits et légumes frais d'Afrique de l'Ouest vers l'Europe, le Canada,
      le Royaume-Uni et le Moyen-Orient. Cette application nécessite JavaScript. Contactez-nous : contact@tropic-aura.com
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
